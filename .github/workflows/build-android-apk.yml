name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - main
    paths:
      - "artifacts/mr-robot-mobile/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build-android-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "artifacts/mr-robot-mobile/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: build-android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "17"
  MOBILE_DIR: artifacts/mr-robot-mobile
  LOG_DIR: build-logs
  EXPO_NO_TELEMETRY: "1"
  CI: "1"

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create build log directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Branch/ref: $GITHUB_REF"
            echo "Commit: $GITHUB_SHA"
            echo "Runner: $(uname -a)"
            echo "Workflow build type: ${{ github.event.inputs.build_type || 'debug' }}"
          } | tee "$LOG_DIR/00-environment.txt"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false

      - name: Configure pnpm store cache
        shell: bash
        run: |
          set -euo pipefail
          echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee "$LOG_DIR/01-pnpm-install.log"

      - name: Typecheck workspace
        shell: bash
        run: |
          set -o pipefail
          pnpm run typecheck 2>&1 | tee "$LOG_DIR/02-typecheck.log"

      - name: Prebuild Expo Android project
        working-directory: ${{ env.MOBILE_DIR }}
        shell: bash
        run: |
          set -o pipefail
          rm -rf android
          pnpm exec expo prebuild --platform android --clean --no-install 2>&1 | tee "../../$LOG_DIR/03-expo-prebuild.log"

      - name: Show generated Android project structure
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Generated Android files:"
            find "$MOBILE_DIR/android" -maxdepth 3 -type f | sort | sed 's#^#- #' | head -300
            echo
            echo "Gradle wrapper:"
            ls -la "$MOBILE_DIR/android/gradlew" || true
          } | tee "$LOG_DIR/04-android-structure.log"

      - name: Make Gradle executable
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$MOBILE_DIR/android/gradlew"

      - name: Build Android APK
        working-directory: ${{ env.MOBILE_DIR }}/android
        shell: bash
        run: |
          set -o pipefail
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew clean assembleRelease --stacktrace --info 2>&1 | tee "../../../$LOG_DIR/05-gradle-assemble-release.log"
          else
            ./gradlew clean assembleDebug --stacktrace --info 2>&1 | tee "../../../$LOG_DIR/05-gradle-assemble-debug.log"
          fi

      - name: Collect APK outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-output
          find "$MOBILE_DIR/android/app/build/outputs/apk" -type f -name "*.apk" -print -exec cp {} apk-output/ \; | tee "$LOG_DIR/06-apk-files.log" || true
          echo "APK output directory:"
          ls -lah apk-output | tee -a "$LOG_DIR/06-apk-files.log"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mr-robot-mobile-apk-${{ github.event.inputs.build_type || 'debug' }}
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: build-logs
          if-no-files-found: warn
          retention-days: 14
