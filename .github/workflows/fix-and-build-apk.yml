name: Fix & Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read
  actions: read

concurrency:
  group: fix-build-android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  MOBILE_DIR: artifacts/mr-robot-mobile
  LOG_DIR: build-logs
  EXPO_NO_TELEMETRY: "1"
  CI: "1"

jobs:
  fix-and-build:
    name: Apply Fixes & Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create build log directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Branch/ref: $GITHUB_REF"
            echo "Commit: $GITHUB_SHA"
            echo "Runner: $(uname -a)"
            echo "Build type: ${{ github.event.inputs.build_type }}"
            echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "$LOG_DIR/00-environment.txt"

      - name: Validate mobile project exists
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$MOBILE_DIR" ]; then
            echo "ERROR: Mobile directory not found: $MOBILE_DIR"
            exit 1
          fi

          if [ ! -f "$MOBILE_DIR/package.json" ]; then
            echo "ERROR: package.json not found in $MOBILE_DIR"
            exit 1
          fi

          if [ ! -f "$MOBILE_DIR/app.json" ]; then
            echo "ERROR: app.json not found in $MOBILE_DIR"
            exit 1
          fi

          {
            echo "Mobile project validated."
            echo "Package name: $(jq -r '.name' "$MOBILE_DIR/package.json")"
            echo "Expo app name: $(jq -r '.expo.name' "$MOBILE_DIR/app.json")"
          } | tee "$LOG_DIR/00-mobile-project-check.log"

      # ──────────────────────────────────────────────────────────────
      # FIX 1: Ensure expo-splash-screen plugin exists in app.json
      # ──────────────────────────────────────────────────────────────
      - name: Fix 1 — Ensure expo-splash-screen plugin
        shell: bash
        run: |
          set -euo pipefail
          APP_JSON="$MOBILE_DIR/app.json"

          if jq -e '.expo.plugins' "$APP_JSON" > /dev/null 2>&1; then
            echo "plugins array exists."
          else
            jq '.expo.plugins = []' "$APP_JSON" > /tmp/app.json.tmp
            mv /tmp/app.json.tmp "$APP_JSON"
            echo "plugins array created."
          fi

          if jq -e '.expo.plugins | map(if type == "string" then . else .[0] end) | index("expo-splash-screen")' "$APP_JSON" > /dev/null 2>&1; then
            echo "expo-splash-screen already present."
          else
            jq '.expo.plugins += ["expo-splash-screen"]' "$APP_JSON" > /tmp/app.json.tmp
            mv /tmp/app.json.tmp "$APP_JSON"
            echo "expo-splash-screen added."
          fi

      # ──────────────────────────────────────────────────────────────
      # FIX 2: Ensure New Architecture is enabled (required for Reanimated 4)
      # ──────────────────────────────────────────────────────────────
      - name: Fix 2 — Ensure New Architecture enabled
        shell: bash
        run: |
          set -euo pipefail
          APP_JSON="$MOBILE_DIR/app.json"

          jq '.expo.newArchEnabled = true' "$APP_JSON" > /tmp/app.json.tmp
          mv /tmp/app.json.tmp "$APP_JSON"
          echo "newArchEnabled set to true"

      # ──────────────────────────────────────────────────────────────
      # FIX 3: Remove risky React Compiler experiment
      # ──────────────────────────────────────────────────────────────
      - name: Fix 3 — Disable React Compiler experiment
        shell: bash
        run: |
          set -euo pipefail
          APP_JSON="$MOBILE_DIR/app.json"

          if jq -e '.expo.experiments.reactCompiler' "$APP_JSON" > /dev/null 2>&1; then
            jq 'del(.expo.experiments.reactCompiler)' "$APP_JSON" > /tmp/app.json.tmp
            mv /tmp/app.json.tmp "$APP_JSON"
            echo "reactCompiler experiment removed."
          else
            echo "reactCompiler experiment not present. OK."
          fi

      # ──────────────────────────────────────────────────────────────
      # FIX 4: Ensure android.package is set for prebuild
      # ──────────────────────────────────────────────────────────────
      - name: Fix 4 — Ensure android.package is set
        shell: bash
        run: |
          set -euo pipefail
          APP_JSON="$MOBILE_DIR/app.json"

          if jq -e '.expo.android.package' "$APP_JSON" > /dev/null 2>&1; then
            echo "android.package already set: $(jq -r '.expo.android.package' "$APP_JSON")"
          else
            jq '.expo.android.package = "com.mrrobot.mobile"' "$APP_JSON" > /tmp/app.json.tmp
            mv /tmp/app.json.tmp "$APP_JSON"
            echo "android.package set to com.mrrobot.mobile"
          fi

      # ──────────────────────────────────────────────────────────────
      # FIX 5: Verify react-native-worklets dependency
      # ──────────────────────────────────────────────────────────────
      - name: Fix 5 — Verify react-native-worklets
        shell: bash
        run: |
          set -euo pipefail
          PKG_JSON="$MOBILE_DIR/package.json"

          if jq -e '.devDependencies["react-native-worklets"] // .dependencies["react-native-worklets"]' "$PKG_JSON" > /dev/null 2>&1; then
            echo "react-native-worklets found in package.json."
          else
            echo "ERROR: react-native-worklets is missing. Reanimated 4.x requires it."
            exit 1
          fi

      - name: Show final app.json state
        shell: bash
        run: |
          echo "=== Final app.json ==="
          jq '.' "$MOBILE_DIR/app.json" | tee "$LOG_DIR/00-final-app-json.log"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false

      - name: Configure pnpm store cache
        shell: bash
        run: |
          set -euo pipefail
          echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee "$LOG_DIR/01-pnpm-install.log"

      - name: Typecheck mobile project
        shell: bash
        working-directory: ${{ env.MOBILE_DIR }}
        run: |
          set -o pipefail
          pnpm run typecheck 2>&1 | tee "../../$LOG_DIR/02-typecheck.log"

      - name: Prebuild Expo Android project
        working-directory: ${{ env.MOBILE_DIR }}
        shell: bash
        run: |
          set -o pipefail
          rm -rf android
          pnpm exec expo prebuild --platform android --clean --no-install 2>&1 | tee "../../$LOG_DIR/03-expo-prebuild.log"

      - name: Verify Android project generated
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$MOBILE_DIR/android/gradlew" ]; then
            echo "ERROR: expo prebuild did not generate Android project"
            exit 1
          fi
          {
            echo "Android project generated successfully"
            find "$MOBILE_DIR/android" -maxdepth 2 -type f | sort | head -80
          } | tee "$LOG_DIR/04-android-structure.log"

      - name: Make Gradle executable
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$MOBILE_DIR/android/gradlew"

      - name: Build Android APK
        working-directory: ${{ env.MOBILE_DIR }}/android
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true"
        run: |
          set -o pipefail
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          echo "Building $BUILD_TYPE APK..."

          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee "../../../$LOG_DIR/05-gradle-build.log"
          else
            ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee "../../../$LOG_DIR/05-gradle-build.log"
          fi

      - name: Collect APK outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-output

          APK_DIR="$MOBILE_DIR/android/app/build/outputs/apk"
          if [ -d "$APK_DIR" ]; then
            APK_COUNT=$(find "$APK_DIR" -type f -name "*.apk" | wc -l)
            echo "Found $APK_COUNT APK file(s)"
            find "$APK_DIR" -type f -name "*.apk" -print -exec cp {} apk-output/ \;
          else
            echo "WARNING: APK output directory does not exist"
            find "$MOBILE_DIR/android" -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
          fi

          echo ""
          echo "=== APK output ==="
          ls -lah apk-output/ 2>/dev/null || echo "(empty)"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mr-robot-mobile-fixed-apk-${{ github.event.inputs.build_type }}
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fix-build-logs
          path: build-logs/
          if-no-files-found: warn
          retention-days: 7
